# Self-hosted Cognee for the personal Hermes profile and Claude Desktop.
# Spec: hermes repo, docs/superpowers/specs/2026-09-20-cognee-selfhost-design.md
#
# Two clients share the STORE, not the transport:
#   Hermes         -> cognee-backend directly (in-process plugin, X-Api-Key)
#   Claude Desktop -> metamcp -> cognee-mcp -> cognee-backend
#
# NO `ports:` ANYWHERE. Host :8000 is the Coolify dashboard. Coolify routes the
# backend's published domain through Traefik; everything else stays internal.
services:
  cognee-backend:
    image: cognee/cognee:1.6.0
    restart: always
    depends_on:
      cognee-postgres:
        condition: service_healthy
    expose:
      - "8000"
    environment:
      # Coolify magic variable. The `_8000` name suffix is what tells the
      # proxy to route to container port 8000; the variable's VALUE slot is
      # for a URL path, NOT a domain, so it is deliberately left empty here.
      # The domain itself is not set from the compose at all -- it lives in
      # the service's Domains field in the Coolify UI, where it must be
      # exactly:  http://cognee.aakashe.org:8000
      # Two details, both load-bearing, both matching every working service
      # in this estate (http://metamcp.aakashe.org:12008,
      # http://paperclip.aakashe.org:3100):
      #   * the INTERNAL container port is part of the value;
      #   * the scheme is http, NOT https. TLS terminates at Cloudflare and
      #     the origin is reached over plain HTTP, so an https value makes
      #     Traefik redirect to https forever -- curl reports
      #     "Maximum (50) redirects followed" and the service looks down.
      # CORS_ALLOWED_ORIGINS below stays https: that is the browser-facing
      # origin, which is a different thing from the origin-side scheme.
      - SERVICE_FQDN_COGNEE_BACKEND_8000
      - ENV=prod
      - DEBUG=false
      - LOG_LEVEL=INFO

      # --- security: every one of these defaults to something unsafe ---
      - ENABLE_BACKEND_ACCESS_CONTROL=true
      - FASTAPI_USERS_JWT_SECRET=${COGNEE_JWT_SECRET}
      - CORS_ALLOWED_ORIGINS=${COGNEE_CORS_ORIGINS}
      # Read ONLY on first boot. Changing these later does not update the
      # already-created superuser.
      - DEFAULT_USER_EMAIL=${COGNEE_DEFAULT_USER_EMAIL}
      - DEFAULT_USER_PASSWORD=${COGNEE_DEFAULT_USER_PASSWORD}

      # --- stores: postgres+pgvector relational/vector, embedded kuzu graph ---
      - DB_PROVIDER=postgres
      - DB_HOST=cognee-postgres
      - DB_PORT=5432
      - DB_NAME=cognee_db
      - DB_USERNAME=cognee
      - DB_PASSWORD=${COGNEE_DB_PASSWORD}
      - VECTOR_DB_PROVIDER=pgvector
      - VECTOR_DB_HOST=cognee-postgres
      - VECTOR_DB_PORT=5432
      - VECTOR_DB_NAME=cognee_db
      # pgvector does NOT inherit the relational DB_* credentials. Cognee
      # validates these four separately and raises
      # `OSError: Missing required pgvector credentials.` at startup if the
      # username or password is absent, even though it is the same server.
      - VECTOR_DB_USERNAME=cognee
      - VECTOR_DB_PASSWORD=${COGNEE_DB_PASSWORD}
      - GRAPH_DATABASE_PROVIDER=kuzu

      # --- models: both halves via OpenRouter, Cognee's `custom` provider ---
      - LLM_PROVIDER=custom
      - LLM_MODEL=openrouter/deepseek/deepseek-v4-flash
      - LLM_ENDPOINT=https://openrouter.ai/api/v1
      - LLM_API_KEY=${OPENROUTER_API_KEY}
      - EMBEDDING_PROVIDER=custom
      - EMBEDDING_MODEL=openrouter/openai/text-embedding-3-small
      - EMBEDDING_API_KEY=${OPENROUTER_API_KEY}
      - EMBEDDING_DIMENSIONS=1536
      # EMBEDDING_ENDPOINT is deliberately absent -- see compose_invariants.py.
    volumes:
      - cognee_system:/cognee-storage/system
      - cognee_data:/cognee-storage/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  cognee-mcp:
    image: cognee/cognee-mcp:main-bbec4a2
    restart: always
    depends_on:
      - cognee-backend
    expose:
      - "8000"
    environment:
      # API mode: forward tool calls to the backend instead of running
      # pipelines locally, so the backend stays the single owner of the stores.
      - TRANSPORT_MODE=sse
      - API_URL=http://cognee-backend:8000
      - API_TOKEN=${COGNEE_MCP_API_TOKEN}

  # Cognee's web UI. The browser talks to the BACKEND directly (not through
  # this container), so COGNEE_BACKEND_URL must be the backend's public
  # address as the browser sees it, and this UI's own origin must appear in
  # the backend's CORS_ALLOWED_ORIGINS above -- otherwise every call from the
  # page is blocked by the browser and the UI looks broken while the backend
  # logs nothing.
  # Domains field in Coolify, same http+port shape as the backend:
  #   http://cognee-ui.aakashe.org:3000
  cognee-ui:
    image: cognee/cognee-ui:1.6.0
    restart: always
    depends_on:
      cognee-backend:
        condition: service_healthy
    expose:
      - "3000"
    environment:
      - SERVICE_FQDN_COGNEE_UI_3000
      - COGNEE_BACKEND_URL=https://cognee.aakashe.org
      # The UI's server-side routes fall back to a default-user login when the
      # browser sent no credentials; must match the backend's value.
      - DEFAULT_USER_PASSWORD=${COGNEE_DEFAULT_USER_PASSWORD}

  # NOT named `postgres`: Coolify's own database container, coolify-db,
  # publishes the alias `postgres` on the shared `coolify` network that this
  # stack joins. A service named `postgres` here resolves to THAT server and
  # fails authentication for user `cognee`.
  cognee-postgres:
    image: pgvector/pgvector:pg17
    restart: always
    environment:
      - POSTGRES_USER=cognee
      - POSTGRES_DB=cognee_db
      - POSTGRES_PASSWORD=${COGNEE_DB_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cognee -d cognee_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  cognee_system:
  cognee_data:
  pg_data:
