version: '3.8'

services:
  hermes:
    build: .
    image: hermes-agent
    container_name: hermes
    restart: unless-stopped
    command: gateway run
    depends_on:
      syncthing:
        condition: service_healthy
    ports:
      - "8642:8642"   # gateway API
      - "9119:9119"   # dashboard (only reached when HERMES_DASHBOARD=1)
    volumes:
      - ~/.hermes:/opt/data
    environment:
      - HERMES_DASHBOARD=1
      - API_SERVER_ENABLED=true
      - MEM0_API_KEY=${MEM0_API_KEY}
      - API_SERVER_HOST=0.0.0.0
      # Shared secret the WebUI presents on /v1/chat/completions calls to the
      # gateway API server. Set API_SERVER_KEY in .env; the hermes-webui service
      # passes the same value as HERMES_WEBUI_GATEWAY_API_KEY.
      - API_SERVER_KEY=${API_SERVER_KEY}
      - SEARXNG_URL=${SEARXNG_URL}
      - HINDSIGHT_API_KEY=${HINDSIGHT_API_KEY}
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - HONCHO_API_KEY=${HONCHO_API_KEY}
      - GATEWAY_SECRET=${GATEWAY_SECRET}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - NOTION_API_KEY=${NOTION_API_KEY}
      - GATEWAY_ALLOW_ALL_USERS=${GATEWAY_ALLOW_ALL_USERS:-true}
      - DISCORD_ALLOWED_USERS=${DISCORD_ALLOWED_USERS}
      - DISCORD_REQUIRE_MENTION=${DISCORD_REQUIRE_MENTION:-false}
      - DISCORD_USE_THREADS=${DISCORD_USE_THREADS:-true}
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET}
      - SPOTIFY_REDIRECT_URI=${SPOTIFY_REDIRECT_URI}
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN}
      # Mnemosyne memory provider: pin its SQLite store to the persistent
      # volume (/opt/data). Explicit path avoids expanduser("~/.hermes")
      # landing in ephemeral /root/.hermes if invoked in a root context.
      - MNEMOSYNE_DATA_DIR=/opt/data/mnemosyne/data
    healthcheck:
      # /health is served by the API server on 8642 (API_SERVER_ENABLED=true).
      # Returns {"status": "ok", "platform": "hermes-agent"}.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8642/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s   # gateway boot + skill load + API server bind
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"

  # hermes-webui — browser/phone frontend for the agent.
  #
  # Runs the stock upstream image as a THIN frontend. Browser chat turns are
  # bridged over HTTP to the patched `hermes` gateway (HERMES_WEBUI_CHAT_BACKEND
  # =gateway → http://hermes:8642/v1/chat/completions), so all LLM + memory work
  # executes in the hermes container — where the Codex null-guard, the Mnemosyne
  # lazy-register patch, and the Mnemosyne/hindsight providers actually live.
  #
  # This is deliberately NOT the upstream "in-process" default: that path builds
  # its own venv from plain hermes-agent[all] and would carry neither our SDK
  # patches (every Codex call crashes on null response.output) nor the Mnemosyne
  # provider. Bridging to the gateway sidesteps both.
  #
  # State (sessions, settings) lands in ~/.hermes/webui on the shared volume.
  hermes-webui:
    image: ghcr.io/nesquena/hermes-webui:latest
    container_name: hermes-webui
    restart: unless-stopped
    depends_on:
      hermes:
        condition: service_healthy
    ports:
      - "8787:8787"   # WebUI (front with a Coolify domain, e.g. hermes-webui.aakashe.org)
    volumes:
      # Same host ~/.hermes as the gateway. The upstream image expects the hermes
      # home at /home/hermeswebui/.hermes (not /opt/data); HERMES_HOME below points
      # the WebUI at this mount. docker_init auto-detects the volume's UID/GID
      # (10000) and remaps the runtime user to match.
      - ~/.hermes:/home/hermeswebui/.hermes
    environment:
      - HERMES_WEBUI_HOST=0.0.0.0
      - HERMES_WEBUI_PORT=8787
      - HERMES_HOME=/home/hermeswebui/.hermes
      - HERMES_WEBUI_STATE_DIR=/home/hermeswebui/.hermes/webui
      # Align the runtime user with the shared volume owner (hermes runs as 10000).
      - WANTED_UID=10000
      - WANTED_GID=10000
      # Route browser chat turns to the patched gateway instead of running the
      # agent in-process. `hermes` resolves on the compose default network.
      - HERMES_WEBUI_CHAT_BACKEND=gateway
      - HERMES_WEBUI_GATEWAY_BASE_URL=http://hermes:8642
      - HERMES_WEBUI_GATEWAY_API_KEY=${API_SERVER_KEY}
      # REQUIRED for an internet-exposed UI: gate the dashboard behind a password.
      - HERMES_WEBUI_PASSWORD=${HERMES_WEBUI_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8787/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

  syncthing:
    image: lscr.io/linuxserver/syncthing:latest
    container_name: hermes-syncthing
    restart: unless-stopped
    environment:
      - PUID=10000
      - PGID=10000
      - TZ=${TZ:-America/Chicago}
    volumes:
      - syncthing_config:/config
      - ~/.hermes:/data1
    ports:
      - "8384:8384"
      - "22000:22000/tcp"
      - "22000:22000/udp"
      - "21027:21027/udp"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8384/"]
      interval: 5s
      timeout: 20s
      retries: 10

  # Read-only web dashboard for the mnemosyne SQLite memory store.
  # Source:  https://github.com/wysie/mnemosyne-dashboard
  # Audit:   stdlib-only Python, parameterized SQL, opens DB with `?mode=ro`.
  #          Single-maintainer 4-week-old repo — hence the explicit commit pin.
  # Auth:    Pre-provision plugin-data/mnemosyne-dashboard/config.json on the
  #          host before first boot (PBKDF2-200k password hash + auth_secret).
  #          Without that file the dashboard runs unauth — which would be a
  #          critical exposure given memory contents include conversation
  #          transcripts and PII.
  # Domain:  Add via Coolify UI → Domains for this service. Suggested:
  #          https://mnemosyne.aakashe.org:8765
  mnemosyne-dashboard:
    image: python:3.12-slim
    container_name: hermes-mnemosyne-dashboard
    restart: unless-stopped
    command:
      - bash
      - -c
      - |
        set -e
        apt-get update -qq && apt-get install -y --no-install-recommends -qq git ca-certificates >/dev/null
        cd /tmp && rm -rf dash
        git clone --quiet https://github.com/wysie/mnemosyne-dashboard.git dash
        cd dash && git checkout --quiet 42ba6b710e339d4c670e79874b7138f1c0f4be2e
        exec python server.py --host 0.0.0.0 --port 8765 --db /data/mnemosyne/mnemosyne.db
    volumes:
      # DB read-only at the kernel layer
      - ~/.hermes/mnemosyne/data:/data/mnemosyne:ro
      # Plugin-data dir holds config.json (auth_secret, password hash). Persists
      # across redeploys; pre-provisioned on the host with `auth_enabled: true`.
      - ~/.hermes/plugin-data:/root/.hermes/plugin-data
    environment:
      - HERMES_HOME=/root/.hermes
      - MNEMOSYNE_DASHBOARD_DB=/data/mnemosyne/mnemosyne.db
      - MNEMOSYNE_DASHBOARD_HOST=0.0.0.0
      - MNEMOSYNE_DASHBOARD_PORT=8765
      - MNEMOSYNE_DASHBOARD_AUTH_ENABLED=true
    healthcheck:
      test:
        - CMD-SHELL
        - 'python -c "import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8765/api/auth/status\", timeout=2)" || exit 1'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

volumes:
  syncthing_config:
