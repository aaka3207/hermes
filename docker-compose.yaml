version: '3.8'

services:
  hermes:
    build: .
    container_name: hermes
    restart: unless-stopped
    # Explicitly run gateway with the API enabled for health checks
    command: gateway run --platform discord --port 8642
    ports:
      - "8642:8642"
      - "9119:9119"
    volumes:
      - hermes_home:/opt/data
    environment:
      - HERMES_DASHBOARD=1
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - HONCHO_API_KEY=${HONCHO_API_KEY}
      - GATEWAY_SECRET=${GATEWAY_SECRET}
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"

volumes:
  hermes_home:
