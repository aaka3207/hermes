version: '3.8'

services:
  hermes:
    build: .
    image: hermes-agent
    container_name: hermes
    restart: unless-stopped
    command: gateway run
    ports:
      - "8642:8642"   # gateway API
      - "9119:9119"   # dashboard (only reached when HERMES_DASHBOARD=1)
    volumes:
      - ~/.hermes:/opt/data
    environment:
      - HERMES_DASHBOARD=1
      - API_SERVER_ENABLED=true
      - MEM0_API_KEY=${MEM0_API_KEY}
      - API_SERVER_HOST=0.0.0.0
      - SEARXNG_URL=${SEARXNG_URL}
      - HINDSIGHT_API_KEY=${HINDSIGHT_API_KEY}
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - HONCHO_API_KEY=${HONCHO_API_KEY}
      - GATEWAY_SECRET=${GATEWAY_SECRET}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - NOTION_API_KEY=${NOTION_API_KEY}
      - GATEWAY_ALLOW_ALL_USERS=${GATEWAY_ALLOW_ALL_USERS:-true}
      - DISCORD_ALLOWED_USERS=${DISCORD_ALLOWED_USERS}
      - DISCORD_REQUIRE_MENTION=${DISCORD_REQUIRE_MENTION:-false}
      - DISCORD_USE_THREADS=${DISCORD_USE_THREADS:-true}
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET}
      - SPOTIFY_REDIRECT_URI=${SPOTIFY_REDIRECT_URI}
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN}
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"

  syncthing:
    build: .
    image: hermes-agent
    container_name: hermes-syncthing
    restart: unless-stopped
    volumes:
      - ~/.hermes:/opt/data
    environment:
      - STNOUPGRADE=1
    ports:
      - "127.0.0.1:8385:8384"
      - "22001:22000/tcp"
      - "22001:22000/udp"
    command:
      - syncthing
      - serve
      - --home=/opt/data/syncthing/config
      - --gui-address=0.0.0.0:8384
      - --no-browser
      - --no-restart
