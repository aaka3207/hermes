version: '3.8'

services:
  hermes:
    build: .
    image: hermes-agent
    container_name: hermes
    restart: unless-stopped
    command: gateway run
    depends_on:
      syncthing:
        condition: service_healthy
    ports:
      - "8642:8642"   # gateway API
      - "9119:9119"   # dashboard (only reached when HERMES_DASHBOARD=1)
    volumes:
      - ~/.hermes:/opt/data
    environment:
      - HERMES_DASHBOARD=1
      - API_SERVER_ENABLED=true
      - MEM0_API_KEY=${MEM0_API_KEY}
      - API_SERVER_HOST=0.0.0.0
      - SEARXNG_URL=${SEARXNG_URL}
      - HINDSIGHT_API_KEY=${HINDSIGHT_API_KEY}
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - HONCHO_API_KEY=${HONCHO_API_KEY}
      - GATEWAY_SECRET=${GATEWAY_SECRET}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - NOTION_API_KEY=${NOTION_API_KEY}
      - GATEWAY_ALLOW_ALL_USERS=${GATEWAY_ALLOW_ALL_USERS:-true}
      - DISCORD_ALLOWED_USERS=${DISCORD_ALLOWED_USERS}
      - DISCORD_REQUIRE_MENTION=${DISCORD_REQUIRE_MENTION:-false}
      - DISCORD_USE_THREADS=${DISCORD_USE_THREADS:-true}
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET}
      - SPOTIFY_REDIRECT_URI=${SPOTIFY_REDIRECT_URI}
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN}
      # Mnemosyne memory provider: pin its SQLite store to the persistent
      # volume (/opt/data). Explicit path avoids expanduser("~/.hermes")
      # landing in ephemeral /root/.hermes if invoked in a root context.
      - MNEMOSYNE_DATA_DIR=/opt/data/mnemosyne/data
    healthcheck:
      # /health is served by the API server on 8642 (API_SERVER_ENABLED=true).
      # Returns {"status": "ok", "platform": "hermes-agent"}.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8642/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s   # gateway boot + skill load + API server bind
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"

  syncthing:
    image: lscr.io/linuxserver/syncthing:latest
    container_name: hermes-syncthing
    restart: unless-stopped
    environment:
      - PUID=10000
      - PGID=10000
      - TZ=${TZ:-America/Chicago}
    volumes:
      - syncthing_config:/config
      - ~/.hermes:/data1
    ports:
      - "8384:8384"
      - "22000:22000/tcp"
      - "22000:22000/udp"
      - "21027:21027/udp"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8384/"]
      interval: 5s
      timeout: 20s
      retries: 10

volumes:
  syncthing_config:
