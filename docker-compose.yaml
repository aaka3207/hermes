version: '3.8'

services:
  hermes:
    build: .
    image: hermes-agent
    container_name: hermes
    restart: unless-stopped
    command: gateway run
    depends_on:
      syncthing:
        condition: service_healthy
    ports:
      - "8642:8642"   # gateway API
      - "9119:9119"   # dashboard (only reached when HERMES_DASHBOARD=1)
    volumes:
      - ~/.hermes:/opt/data
    environment:
      - HERMES_DASHBOARD=1
      # Basic-auth gate for the hermes dashboard (port 9119). Set in Coolify;
      # referenced here so they reach the runtime container. The SECRET signs
      # session cookies — set a stable value so sessions survive restarts;
      # without it a random key is generated per boot and you're logged out on
      # every restart.
      - HERMES_DASHBOARD_BASIC_AUTH_USERNAME=${HERMES_DASHBOARD_BASIC_AUTH_USERNAME}
      - HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD}
      - HERMES_DASHBOARD_BASIC_AUTH_SECRET=${HERMES_DASHBOARD_BASIC_AUTH_SECRET}
      - API_SERVER_ENABLED=true
      - MEM0_API_KEY=${MEM0_API_KEY}
      - API_SERVER_HOST=0.0.0.0
      # Shared secret the WebUI presents on /v1/chat/completions calls to the
      # gateway API server. Set API_SERVER_KEY in .env; the hermes-webui service
      # passes the same value as HERMES_WEBUI_GATEWAY_API_KEY.
      - API_SERVER_KEY=${API_SERVER_KEY}
      - SEARXNG_URL=${SEARXNG_URL}
      - HINDSIGHT_API_KEY=${HINDSIGHT_API_KEY}
      - METAMCP_API_KEY=${METAMCP_API_KEY}
      # Camofox anti-detection browser companion (its own Coolify app). Set in Coolify.
      - CAMOFOX_URL=${CAMOFOX_URL}
      # Cognee memory provider (cloud/remote mode). Set in Coolify.
      - COGNEE_BASE_URL=${COGNEE_BASE_URL}
      - COGNEE_API_KEY=${COGNEE_API_KEY}
      - COGNEE_DATASET=${COGNEE_DATASET:-hermes}
      - DISCORD_BOT_TOKEN=${DISCORD_TOKEN}
      - HONCHO_API_KEY=${HONCHO_API_KEY}
      - GATEWAY_SECRET=${GATEWAY_SECRET}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - NOTION_API_KEY=${NOTION_API_KEY}
      - GATEWAY_ALLOW_ALL_USERS=${GATEWAY_ALLOW_ALL_USERS:-false}
      - DISCORD_ALLOWED_USERS=${DISCORD_ALLOWED_USERS}
      - DISCORD_REQUIRE_MENTION=${DISCORD_REQUIRE_MENTION:-true}
      - DISCORD_AUTO_THREAD=${DISCORD_AUTO_THREAD:-true}
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET}
      - SPOTIFY_REDIRECT_URI=${SPOTIFY_REDIRECT_URI}
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN}
      # Mnemosyne memory provider: pin its SQLite store to the persistent
      # volume (/opt/data). Explicit path avoids expanduser("~/.hermes")
      # landing in ephemeral /root/.hermes if invoked in a root context. This
      # resolves to ~/.hermes/mnemosyne/data on the host — the SAME path the
      # standalone mnemosyne-mcp Coolify service (separate repo) must bind-mount
      # as its MNEMOSYNE_HOST_DATA_DIR, so both share one SQLite file.
      - MNEMOSYNE_DATA_DIR=/opt/data/mnemosyne/data
      # Route mnemosyne's embeddings through OpenRouter's OpenAI-compatible
      # /embeddings endpoint instead of local fastembed ONNX inference — keeps
      # embedding generation off this container's CPU/RAM budget (the
      # [embeddings] extra/fastembed is deliberately not installed above).
      # IMPORTANT: mnemosyne 3.5.0's embedding code (mnemosyne/core/embeddings.py)
      # reads its OWN vars — MNEMOSYNE_EMBEDDING_API_KEY (falling back only to
      # OPENAI_API_KEY, NOT OPENROUTER_API_KEY) and MNEMOSYNE_EMBEDDING_API_URL
      # (NOT OPENROUTER_BASE_URL). Without MNEMOSYNE_EMBEDDING_API_KEY set,
      # available() returns False and it silently drops to FTS5 keyword-only
      # (verified: embeddings_available: NO in `hermes mnemosyne doctor`). We
      # reuse the existing OPENROUTER_API_KEY value via ${...} interpolation.
      # MNEMOSYNE_EMBEDDING_DIM must match the model (1536 for
      # openai/text-embedding-3-small) and the standalone mnemosyne-mcp
      # service's setting, since they share one vector table.
      - MNEMOSYNE_EMBEDDINGS_VIA_API=true
      - MNEMOSYNE_EMBEDDING_API_URL=https://openrouter.ai/api/v1
      - MNEMOSYNE_EMBEDDING_API_KEY=${OPENROUTER_API_KEY}
      - MNEMOSYNE_EMBEDDING_MODEL=openai/text-embedding-3-small
      - MNEMOSYNE_EMBEDDING_DIM=1536
      # MNEMOSYNE_EXTRACTION_PROMPT is set in Coolify (reaches the container via
      # env_file: .env) — it steers fact extraction toward durable, portable,
      # user-centric memories and drops ephemeral session/technical/debug detail
      # (so the shared store is meaningful in Claude Desktop too). It ONLY takes
      # effect because the lazy-register patch (Dockerfile) keeps the Codex host
      # LLM attached to the extraction path; without a live LLM, extract_facts()
      # returns [] and the prompt is never consulted. Tunable in the Coolify UI +
      # restart (no rebuild needed).
      # Obsidian vault + wiki paths for the agent (synced into /opt/data/Sync via
      # syncthing). Values are set in Coolify; referenced here so they reach the
      # hermes *runtime* container — Coolify otherwise only passes them as unused
      # build args. Default to the on-volume Sync paths if unset in Coolify.
      - OBSIDIAN_VAULT_PATH=${OBSIDIAN_VAULT_PATH:-/opt/data/Sync/obsidian}
      - WIKI_PATH=${WIKI_PATH:-/opt/data/Sync/obsidian/wiki}
    healthcheck:
      # /health is served by the API server on 8642 (API_SERVER_ENABLED=true).
      # Returns {"status": "ok", "platform": "hermes-agent"}.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8642/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      # The gateway is slow to boot: container start → s6 init → "Gateway
      # Starting" banner takes ~110s, and the API server binds 8642 later still
      # (measured ~150-200s+ under load). `docker compose up` waits out the
      # start_period before counting failures, so it must exceed real boot time
      # or the deploy aborts the gateway as unhealthy while it's still starting —
      # which then leaves dependents (hermes-webui) stuck in "Created". The
      # concurrent mnemosyne-dashboard startup (apt+git clone) adds contention,
      # so allow generous margin.
      start_period: 300s
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"

  # hermes-webui — browser/phone frontend for the agent.
  #
  # Runs the stock upstream image as a THIN frontend. Browser chat turns are
  # bridged over HTTP to the patched `hermes` gateway (HERMES_WEBUI_CHAT_BACKEND
  # =gateway → http://hermes:8642/v1/chat/completions), so all LLM + memory work
  # executes in the hermes container — where the Codex null-guard, the Mnemosyne
  # lazy-register patch, and the Mnemosyne/hindsight providers actually live.
  #
  # This is deliberately NOT the upstream "in-process" default: that path builds
  # its own venv from plain hermes-agent[all] and would carry neither our SDK
  # patches (every Codex call crashes on null response.output) nor the Mnemosyne
  # provider. Bridging to the gateway sidesteps both.
  #
  # State (sessions, settings) lands in ~/.hermes/webui on the shared volume.
  hermes-webui:
    image: ghcr.io/nesquena/hermes-webui:latest
    container_name: hermes-webui
    restart: unless-stopped
    depends_on:
      hermes:
        condition: service_healthy
    ports:
      - "8787:8787"   # WebUI (front with a Coolify domain, e.g. hermes-webui.aakashe.org)
    volumes:
      # Same host ~/.hermes as the gateway. The upstream image expects the hermes
      # home at /home/hermeswebui/.hermes (not /opt/data); HERMES_HOME below points
      # the WebUI at this mount. docker_init auto-detects the volume's UID/GID
      # (10000) and remaps the runtime user to match.
      - ~/.hermes:/home/hermeswebui/.hermes
    environment:
      - HERMES_WEBUI_HOST=0.0.0.0
      - HERMES_WEBUI_PORT=8787
      - HERMES_HOME=/home/hermeswebui/.hermes
      - HERMES_WEBUI_STATE_DIR=/home/hermeswebui/.hermes/webui
      # Align the runtime user with the shared volume owner (hermes runs as 10000).
      - WANTED_UID=10000
      - WANTED_GID=10000
      # Route browser chat turns to the patched gateway instead of running the
      # agent in-process. `hermes` resolves on the compose default network.
      - HERMES_WEBUI_CHAT_BACKEND=gateway
      - HERMES_WEBUI_GATEWAY_BASE_URL=http://hermes:8642
      - HERMES_WEBUI_GATEWAY_API_KEY=${API_SERVER_KEY}
      # REQUIRED for an internet-exposed UI: gate the dashboard behind a password.
      - HERMES_WEBUI_PASSWORD=${HERMES_WEBUI_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8787/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      # First boot creates a venv and uv-pip-installs deps before binding 8787,
      # which can exceed 30s on a cold image. Margin avoids a false-unhealthy.
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

  syncthing:
    image: lscr.io/linuxserver/syncthing:latest
    container_name: hermes-syncthing
    restart: unless-stopped
    environment:
      - PUID=10000
      - PGID=10000
      - TZ=${TZ:-America/Chicago}
    volumes:
      - syncthing_config:/config
      - ~/.hermes:/data1
    ports:
      - "8384:8384"
      - "22000:22000/tcp"
      - "22000:22000/udp"
      - "21027:21027/udp"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8384/"]
      interval: 5s
      timeout: 20s
      retries: 10

