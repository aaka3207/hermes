version: '3.8'

services:
  hermes-career-agent:
    build: .
    container_name: hermes-agent
    restart: always
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - HONCHO_API_KEY=${HONCHO_API_KEY}
      - GATEWAY_SECRET=${GATEWAY_SECRET}
      - HERMES_PROFILE=career-agent
    volumes:
      - hermes_data:/home/hermes/.hermes
      - ./skills:/home/hermes/.hermes/skills
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  hermes_data:
